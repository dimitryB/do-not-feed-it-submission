name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: npm audit --omit=dev --audit-level=high
      # Hardhat still requires Zod 3; see docs/RELEASE_REVIEW.md for the
      # upstream high advisory. Report all tooling findings; block criticals.
      - run: npm audit --audit-level=critical
